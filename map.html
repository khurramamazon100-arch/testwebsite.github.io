    <button onclick="openGoogleMaps()">Find Restaurants Near Me</button>

    <script>
        function openGoogleMaps() {
            
       
            var location = 'cofee shop';

        }

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: -34.397, lng: 150.644 }, // Default center location (Sydney, Australia)
                
                zoom: 15
            });
            var googleMapsUrl = 'https://www.google.com/maps?q=' + center;
            
            window.open(googleMapsUrl, '_blank');
        }

        function findRestaurants() {
            
            // Use Geolocation API to get user's current location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const pos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // Center map to user's current location
                    map.setCenter(pos);

                    // Perform a nearby search for restaurants
                    const service = new google.maps.places.PlacesService(map);
                    service.nearbySearch({
                        location: pos,
                        radius: 1000, // Search radius in meters (adjust as needed)
                        type: 'restaurant' // Type of place to search (restaurant in this case)
                    }, callback);
                }, function() {
                    alert('Error: The Geolocation service failed.');
                });
            } else {
                alert('Error: Your browser doesn\'t support geolocation.');
            }
        }

        function callback(results, status) {
            if (status === google.maps.places.PlacesServiceStatus.OK) {
                for (let i = 0; i < results.length; i++) {
                    createMarker(results[i]);
                }
            }
        }

        function createMarker(place) {
            new google.maps.Marker({
                map: map,
                position: place.geometry.location
            });
        }
    </script>
